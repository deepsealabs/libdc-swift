name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: swift test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: swift test
        run: swift test

  build-generic:
    name: xcodebuild generic iOS + macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build LibDCSwift for generic iOS
        run: >
          xcodebuild -scheme LibDCSwift -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData-ios build

      - name: Build LibDCSwift for generic macOS
        run: >
          xcodebuild -scheme LibDCSwift -destination 'generic/platform=macOS'
          -derivedDataPath DerivedData-macos build

      - name: Build LibDCBridge product for generic iOS
        # The LibDCSwift scheme links LibDCBridge into a relocatable .o; the
        # dynamic framework the no-IOKit-on-iOS check below inspects only
        # exists when LibDCBridge is built as its own scheme/product.
        run: >
          xcodebuild -scheme LibDCBridge -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData-ios-bridge build

      - name: No IOKit symbols in the iOS LibDCBridge slice
        run: |
          set -euo pipefail
          BIN="DerivedData-ios-bridge/Build/Products/Debug-iphoneos/PackageFrameworks/LibDCBridge.framework/LibDCBridge"
          if [ ! -f "$BIN" ]; then
            echo "::error::expected binary not found at $BIN"
            exit 1
          fi
          echo "Linked frameworks:"
          otool -L "$BIN"
          if otool -L "$BIN" | grep -q 'IOKit\.framework'; then
            echo "::error::LibDCBridge (iOS) links IOKit.framework -- IOKit is macOS-only"
            exit 1
          fi
          # IOKit's own C API is IOxxx/kIOxxx (capitalized); POSIX ioctl() is
          # lowercase and must not be mistaken for it.
          IOKIT_SYMS=$(nm -u "$BIN" | grep -E '_IO[A-Z]|_kIO' || true)
          if [ -n "$IOKIT_SYMS" ]; then
            echo "::error::undefined IOKit-style symbols in the iOS LibDCBridge slice:"
            echo "$IOKIT_SYMS"
            exit 1
          fi
          echo "OK: no IOKit linkage or symbols in the iOS LibDCBridge slice."

  test-ios-simulator:
    name: xcodebuild test (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Boot an iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; runtimes = json.load(sys.stdin)["devices"]; ios = [d for r, ds in runtimes.items() if r.startswith("com.apple.CoreSimulator.SimRuntime.iOS-") for d in ds]; iphones = [d for d in ios if d["name"].startswith("iPhone")]; print((iphones or ios)[0]["udid"])')
          xcrun simctl boot "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: swift test (goldens, characterization, iostream open, descriptor lookup, sessions, identity)
        run: >
          xcodebuild test -scheme LibDCSwift-Package
          -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath DerivedData-ios-sim
          -only-testing:LibDCSwiftTests/GoldenParserTests
          -only-testing:LibDCSwiftTests/DescriptorMatchingTests
          -only-testing:LibDCSwiftTests/StorageInjectionTests
          -only-testing:LibDCSwiftTests/RetrievalSeamTests
          -only-testing:LibDCSwiftTests/OpenDeviceOnIOStreamTests
          -only-testing:LibDCSwiftTests/DescriptorTransportLookupTests
          -only-testing:LibDCSwiftTests/DiveComputerSessionTests
          -only-testing:LibDCSwiftTests/SessionClockTests
          -only-testing:LibDCSwiftTests/DeviceCatalogTests
          -only-testing:LibDCSwiftTests/DiveComputerIdentityTests
          -only-testing:LibDCSwiftTests/StoredDeviceTransportTests
          -only-testing:LibDCSwiftTests/FingerprintIdentityTests
          -only-testing:LibDCSwiftTests/SessionIdentityTests

  dc-tester:
    name: DC Tester app (generic iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        # Not version-pinned: homebrew-core keeps one current formula, and
        # pinning would mean building XcodeGen from a tagged commit instead.
        # The generate-diff check below is the actual safety net -- any
        # version drift that changes the generated project fails the build.
        run: brew install xcodegen

      - name: Generate NauticTestApp.xcodeproj
        working-directory: NauticTestApp
        run: xcodegen generate

      - name: Fail if the generated project drifted from the committed one
        working-directory: NauticTestApp
        run: git diff --exit-code -- NauticTestApp.xcodeproj

      - name: Build NauticTestApp for generic iOS
        working-directory: NauticTestApp
        run: >
          xcodebuild -project NauticTestApp.xcodeproj -scheme NauticTestApp
          -destination 'generic/platform=iOS' -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO build
